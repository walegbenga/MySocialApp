services:
  api:
    build: { context: . }
    working_dir: /var/www/html
    volumes: ["./:/var/www/html"]
    ports: ["8000:8000"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mysocialapp
      DB_USERNAME: mysocialapp
      DB_PASSWORD: mysocialapp_local_password
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mysocialapp
      POSTGRES_USER: mysocialapp
      POSTGRES_PASSWORD: mysocialapp_local_password
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysocialapp -d mysocialapp"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
